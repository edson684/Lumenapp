<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0b0f">
<title>Lumen</title>
<style>
:root{--bg:#0b0b0f;--pn:#17171d;--ln:#26262e;--tx:#fff;--mu:#a1a1aa;--ac:#0a84ff;--live:#ff453a;--sa:env(safe-area-inset-top,0px);--sb:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}[hidden]{display:none!important}
html,body{margin:0;background:var(--bg)}body.lock{overflow:hidden}
body{font:15px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Display",Inter,"Helvetica Neue",sans-serif;color:var(--tx);padding-bottom:calc(110px + var(--sb))}
.g{background:rgba(40,40,48,.62);-webkit-backdrop-filter:blur(22px) saturate(1.4);backdrop-filter:blur(22px) saturate(1.4)}
button,input,select,textarea{font:inherit;color:var(--tx);min-width:0}
button{border:0;cursor:pointer;background:none;padding:0}
input,select,textarea{background:var(--pn);border:1px solid var(--ln);border-radius:14px;padding:12px 14px;width:100%}
::placeholder{color:#8b8b95}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
svg{fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.btn{height:48px;border-radius:24px;font-weight:600;font-size:16px;background:#fff;color:#0b0b0f;width:100%}
header{position:sticky;top:0;z-index:5;padding:calc(10px + var(--sa)) 20px 12px;border-bottom:1px solid rgba(255,255,255,.06)}
.hd{display:flex;align-items:center;justify-content:space-between}
.hd b{font-size:28px;font-weight:800;letter-spacing:-.6px}#pxs{font-size:11px;font-weight:600;color:var(--mu);border:1px solid var(--ln);border-radius:12px;padding:4px 10px}#pxs.ok{color:#30d158;border-color:#1f5a30}
.fl{display:flex;gap:8px;margin-top:10px}.fl input{flex:1;border-radius:12px;padding:10px 14px}
main{padding:0 0 8px}
#empty{margin:40px 20px;padding:28px 20px;border-radius:24px;text-align:center;background:linear-gradient(150deg,#1c2a4a,#16161d)}
#empty h2{margin:0 0 6px;font-size:24px;letter-spacing:-.5px}#empty p{margin:0 0 18px;color:var(--mu)}
h3{font-size:19px;font-weight:700;letter-spacing:-.3px;margin:22px 20px 10px}
.rr{display:flex;gap:12px;padding:0 20px;overflow-x:auto;scrollbar-width:none}.rr::-webkit-scrollbar{display:none}
.rc{flex:none;width:168px;text-align:left}.rc i{display:block;height:94px;border-radius:14px;position:relative;overflow:hidden}.rc img{position:absolute;inset:14px;width:calc(100% - 28px);height:calc(100% - 28px);object-fit:contain}
.rc span{display:block;font-size:13px;margin-top:7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#cnt{margin:18px 20px 10px;font-size:13px;color:var(--mu)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(108px,1fr));gap:12px;padding:0 20px}
.tl{position:relative;aspect-ratio:2/3;border-radius:16px;overflow:hidden;cursor:pointer;display:flex;align-items:flex-end;isolation:isolate}
.tl img{position:absolute;inset:0;width:100%;height:100%;z-index:-1}.tl img.lv{inset:18% 14% 34%;width:72%;height:48%;object-fit:contain}.tl img.vd{object-fit:cover}
.tl .nm{width:100%;padding:28px 10px 9px;font-size:12px;font-weight:600;line-height:1.25;background:linear-gradient(transparent,rgba(0,0,0,.82));display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tl .lb{position:absolute;top:8px;left:8px;font-size:10px;font-weight:700;letter-spacing:.5px;background:var(--live);border-radius:6px;padding:2px 6px}
.tl .fv{position:absolute;top:4px;right:4px;width:34px;height:34px;display:flex;align-items:center;justify-content:center;color:#fff;opacity:.85}
.tl .fv.on{color:#ffd60a}.tl .fv.on svg{fill:currentColor}
.tb{position:fixed;z-index:6;left:16px;right:16px;bottom:calc(16px + var(--sb));height:64px;border-radius:32px;display:flex;justify-content:space-around;align-items:center;max-width:520px;margin:0 auto;border:1px solid rgba(255,255,255,.08)}
.tb button{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10px;color:var(--mu);padding:6px 10px}.tb button.on{color:#fff}.tb button.on svg{color:var(--ac)}
.ov{position:fixed;inset:0;z-index:20;display:flex;align-items:flex-end;justify-content:center;background:rgba(0,0,0,.55)}
.sheet{width:100%;max-width:560px;max-height:88dvh;overflow:auto;border-radius:28px 28px 0 0;background:#141419;padding:18px 20px calc(24px + var(--sb));display:grid;gap:10px}
.sheet h2{margin:0;font-size:26px;letter-spacing:-.6px}.sheet .gr{width:40px;height:5px;border-radius:3px;background:#3a3a44;margin:0 auto 6px}
.seg{display:flex;background:var(--pn);border-radius:12px;padding:3px}.seg button{flex:1;padding:8px;border-radius:10px;font-weight:600;font-size:14px;color:var(--mu)}.seg button.on{background:#3a3a44;color:#fff}
.pane{display:grid;gap:10px}input[type=file]{padding:10px}
#msg{font-size:13px;color:var(--mu);min-height:18px}#msg.bad{color:#ff6961}
#pl{position:fixed;inset:0;z-index:30;background:#000;overflow:hidden}
#pl video{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#000}
.ui{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:space-between;padding:calc(14px + var(--sa)) max(22px,env(safe-area-inset-right,0px)) calc(16px + var(--sb)) max(22px,env(safe-area-inset-left,0px));background:linear-gradient(rgba(0,0,0,.6),transparent 30%,transparent 55%,rgba(0,0,0,.8));transition:opacity .25s}
#pl.hide .ui{opacity:0;pointer-events:none}
.top{display:flex;align-items:center;gap:12px}.top .t{flex:1;min-width:0}#np{font-weight:700;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rd{width:44px;height:44px;border-radius:22px;display:flex;align-items:center;justify-content:center;flex:none}
#lvb{font-size:11px;font-weight:700;background:var(--live);border-radius:7px;padding:3px 8px}
.mid{display:flex;justify-content:center;align-items:center;gap:clamp(28px,12vw,64px)}.mid .sk{width:56px;height:56px;color:#fff;display:flex;align-items:center;justify-content:center}
#pp{width:76px;height:76px;border-radius:38px;display:flex;align-items:center;justify-content:center}#pp .pa{display:none}#pl:not(.paused) #pp .pa{display:block}#pl:not(.paused) #pp .pl{display:none}
#pl.live .sk,#pl.live .sb{display:none}
.bot{display:flex;align-items:center;gap:12px;font-size:12px;font-variant-numeric:tabular-nums}
.bot input{flex:1;padding:0;height:20px;background:none;border:0;accent-color:#fff}
#er{position:absolute;left:24px;right:24px;top:50%;transform:translateY(60px);text-align:center;color:#ff8f88;font-size:13px}#er:empty{display:none}
@media(orientation:landscape) and (max-height:520px){.tb{height:52px;bottom:calc(10px + var(--sb));max-width:420px}.tb button{font-size:0;gap:0}.grid{grid-template-columns:repeat(auto-fill,minmax(120px,1fr))}header{padding-top:calc(6px + var(--sa))}.hd b{font-size:22px}.fl{margin-top:6px}#empty{margin:16px auto;max-width:420px}.mid{gap:48px}#pp{width:64px;height:64px}}
@media(min-width:900px){.grid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}}

.ib{width:40px;height:40px;border-radius:20px;background:rgba(255,255,255,.1);display:flex;align-items:center;justify-content:center;color:#fff;flex:none;margin-left:8px}.ib.on{color:#ffd60a}.ib.on svg{fill:currentColor}
.btn.g2{background:rgba(255,255,255,.2);color:#fff;-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px)}
#hero{position:relative;overflow:hidden;padding:22px 20px 26px;transition:opacity .2s}#hero.sw .hc{opacity:0;transform:translateY(6px)}
.hc{position:relative;display:flex;flex-direction:column;align-items:center;text-align:center;gap:16px;transition:opacity .25s,transform .25s}
.hb{position:absolute;inset:-30px;filter:blur(28px) saturate(1.3);opacity:.65}.hb img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.hs{position:absolute;inset:0;background:linear-gradient(rgba(11,11,15,.1),var(--bg) 96%)}
.hp{position:relative;width:150px;aspect-ratio:2/3;border-radius:18px;overflow:hidden;box-shadow:0 18px 40px rgba(0,0,0,.55);flex:none}.hp img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.ht{width:100%;min-width:0}.ht small{font-size:11px;font-weight:700;letter-spacing:1.4px;color:#d4d4d8}.ht h2{margin:4px 0;font-size:30px;line-height:1.1;letter-spacing:-.8px}.ht p{margin:0 0 14px;font-size:13px;color:#d4d4d8}
.hbt{display:flex;gap:10px}.dots{display:flex;justify-content:center;gap:6px;margin-top:16px}.dots i{width:6px;height:6px;border-radius:3px;background:rgba(255,255,255,.35);transition:width .25s,background .25s}.dots i.on{width:20px;background:#fff}
.rr .tl{flex:none;width:118px}
#rows section{margin-top:4px}
@keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@media(prefers-reduced-motion:no-preference){.rr>*,.grid>*{animation:up .45s both;animation-delay:calc(var(--d,0)*40ms)}.tl,.rc,.btn,.ib{transition:transform .15s}.tl:active,.rc:active,.btn:active,.ib:active{transform:scale(.96)}}
.sh{display:flex;gap:14px;align-items:center}.sp{position:relative;width:64px;aspect-ratio:2/3;border-radius:12px;overflow:hidden;flex:none}.sp img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}.sh small{color:var(--mu)}
#spl{margin:0;font-size:13px;color:var(--mu);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none}.chips button{flex:none;padding:8px 14px;border-radius:16px;background:var(--pn);font-size:13px;font-weight:600;color:var(--mu)}.chips button.on{background:#fff;color:#0b0b0f}
.ep{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:12px 4px;border-bottom:1px solid var(--ln)}.ep b{width:34px;color:var(--mu);font-size:13px;flex:none}.ep span{flex:1;min-width:0;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@media(orientation:landscape) and (max-height:520px){.hc{flex-direction:row;text-align:left;gap:24px}.hp{width:112px}.ht h2{font-size:24px}.dots{justify-content:flex-start}.hbt{max-width:360px}}
@media(min-width:900px){#hero{padding:32px max(40px,calc(50% - 480px))}}

.gb{flex:none;max-width:46%;display:flex;align-items:center;gap:6px;padding:0 12px;height:40px;border-radius:12px;background:rgba(255,255,255,.1);font-size:14px;font-weight:600}.gb span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.gb.on{background:#fff;color:#0b0b0f}
.gl{display:grid;gap:2px}.gi{display:flex;align-items:center;gap:10px;width:100%;padding:13px 10px;border-radius:12px;text-align:left}.gi span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:16px}.gi small{color:var(--mu)}.gi.on{background:rgba(255,255,255,.09)}.gi svg{color:var(--ac)}
#toast{position:fixed;left:50%;bottom:120px;transform:translateX(-50%);z-index:60;max-width:86%;padding:10px 18px;border-radius:20px;background:rgba(48,48,58,.92);font-size:14px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .2s;text-align:center}#toast.on{opacity:1}
.tl .dlb{position:absolute;top:4px;left:4px;width:34px;height:34px;display:flex;align-items:center;justify-content:center;color:#fff;opacity:.85}
.epr{display:flex;align-items:center;border-bottom:1px solid var(--ln)}.epr .ep{border:0;flex:1;min-width:0}.dlx{width:44px;height:44px;flex:none;color:var(--mu);display:flex;align-items:center;justify-content:center}
#dlc{padding:14px 20px 0}#dlc h3{margin:6px 0 10px}.s2{color:var(--mu);font-size:14px;margin:8px 0}
.dr{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--ln);cursor:pointer}.dr i{position:relative;width:96px;height:56px;border-radius:10px;overflow:hidden;flex:none}.dr i img{position:absolute;inset:6px;width:calc(100% - 12px);height:calc(100% - 12px);object-fit:contain}
.dt{flex:1;min-width:0}.dt .n{display:block;font-size:14px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.dt .st{display:block;font-size:12px;color:var(--mu);margin-top:2px}.dt .pr{margin:6px 0 0}.dt .pr b{background:var(--ac)}.dt .st.bad{color:#ff6961}
.dx{width:40px;height:40px;flex:none;color:var(--mu);display:flex;align-items:center;justify-content:center}
.up{display:flex;align-items:center;gap:10px;margin:12px 20px 0;padding:12px 12px 12px 16px;border-radius:16px;background:linear-gradient(135deg,#0050c8,#4240b8);font-size:14px;font-weight:600}.up span{flex:1}.up .ub{background:#fff;color:#0b0b0f;border-radius:14px;padding:8px 14px;font-weight:700;flex:none}.up .ux{width:30px;height:30px;color:#fff;opacity:.85;flex:none;display:flex;align-items:center;justify-content:center}
</style>
</head>
<body>
<header class="g"><div class="hd"><b>Lumen</b><span style="flex:1"></span><small id="pxs"></small><button class="ib" id="bf" aria-label="Minha lista"><svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4l2.5 5 5.5.8-4 3.9.9 5.5-4.9-2.6-4.9 2.6.9-5.5-4-3.9 5.5-.8z"/></svg></button><button class="ib" id="bs" aria-label="Fontes"><svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg></button></div>
<div class="fl"><input id="q" type="search" placeholder="Buscar canal, filme ou série" aria-label="Buscar"><button class="gb" id="gb" aria-label="Categoria"><span id="gl">Todas as categorias</span><svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 10l5 5 5-5"/></svg></button><select id="g" hidden></select></div></header>

<main>
  <div id="upd" class="up" hidden><span id="upt"></span><button class="ub" id="upb">Baixar</button><button class="ux" id="upx" aria-label="Fechar"><svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
  <div id="empty" hidden><h2>Bem-vindo ao Lumen</h2><p>Adicione sua lista M3U ou sua conta Xtream para começar.</p><button class="btn" id="oe">Adicionar fonte</button></div>
  <div id="homec" hidden><div id="hero" hidden></div><section id="recs" hidden><h3>Continuar assistindo</h3><div class="rr" id="rr"></div></section><div id="rows"></div></div>
  <div id="dlc" hidden><h3>Downloads</h3><p class="s2" id="dlh"></p><div id="dll"></div></div>
  <div id="cnt" hidden></div>
  <div class="grid" id="list" hidden></div>
</main>

<nav class="tb g" id="ft" aria-label="Navegação">
  <button data-t="home" class="on"><svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 11l8-7 8 7v9H4z"/></svg>Início</button>
  <button data-t="vod"><svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="5" width="17" height="14" rx="3"/><path d="M10 9.5v5l4-2.5z"/></svg>Filmes</button>
  <button data-t="series"><svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="7" width="17" height="12" rx="2.5"/><path d="M8 3.5l4 3.5 4-3.5"/></svg>Séries</button>
  <button data-t="live"><svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="2.5"/><path d="M7.5 7.5a6.4 6.4 0 0 0 0 9M16.5 7.5a6.4 6.4 0 0 1 0 9"/></svg>Ao vivo</button>
  <button data-t="dl"><svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v11M7.5 11l4.5 4.5 4.5-4.5M5 19.500h14"/></svg>Downloads</button>
</nav>

<div id="setup" class="ov" hidden><section class="sheet" role="dialog" aria-label="Fontes">
  <div class="gr"></div><h2>Fontes</h2>
  <div class="seg" id="st"><button data-p="m" class="on">Lista M3U</button><button data-p="x">Xtream</button></div>
  <div class="pane" id="p-m">
    <input id="mu" placeholder="Endereço da lista (http://.../lista.m3u)" inputmode="url" autocapitalize="off" aria-label="Endereço da lista">
    <input id="mf" type="file" accept=".m3u,.m3u8,.txt" aria-label="Arquivo da lista">
    <textarea id="mt" rows="3" placeholder="Ou cole o conteúdo da lista aqui" aria-label="Conteúdo da lista"></textarea>
    <button class="btn" id="bm">Carregar lista</button>
  </div>
  <div class="pane" id="p-x" hidden>
    <input id="xs" placeholder="Servidor (http://servidor.com:8080)" inputmode="url" autocapitalize="off" aria-label="Servidor">
    <input id="xu" placeholder="Usuário" autocapitalize="off" autocomplete="off" aria-label="Usuário">
    <input id="xp" placeholder="Senha" type="password" autocomplete="off" aria-label="Senha">
    <select id="fmt" aria-label="Formato"><option value="m3u8">Canais ao vivo em HLS (m3u8)</option><option value="ts">Canais ao vivo em TS</option></select>
    <button class="btn" id="bx">Entrar</button>
  </div>
  <input id="srv" placeholder="Servidor proxy (só se o site estiver hospedado em outro lugar)" inputmode="url" autocapitalize="off" aria-label="Servidor proxy">
  <div id="msg"></div>
  <button class="btn g2" id="bdel" hidden>Limpar lista salva</button>
  <div class="s2" id="ver"></div><button class="btn g2" id="bup" hidden>Verificar atualização</button>
</section></div>

<div id="sr" class="ov" hidden><section class="sheet" role="dialog" aria-label="Série"><div class="gr"></div><div class="sh"><div class="sp" id="sp"></div><div><h2 id="sn"></h2><small id="sg"></small></div></div><p id="spl"></p><div class="chips" id="sc"></div><div id="se"></div></section></div>

<div id="gs" class="ov" hidden><section class="sheet" role="dialog" aria-label="Categorias"><div class="gr"></div><h2>Categorias</h2><input id="gq" type="search" placeholder="Buscar categoria" aria-label="Buscar categoria"><div class="gl" id="gl2"></div></section></div>
<div id="toast" role="status"></div>

<div id="pl" class="paused" hidden>
  <video id="v" playsinline autoplay></video>
  <div class="ui" id="ui">
    <div class="top"><button class="rd g" id="cl" aria-label="Fechar"><svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button><div class="t"><div id="np"></div></div><span id="lvb" hidden>AO VIVO</span><button class="rd g" id="pd" aria-label="Baixar"><svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v11M7.5 11l4.5 4.5 4.5-4.5M5 19.5h14"/></svg></button></div>
    <div class="mid"><button class="sk" id="rw" aria-label="Voltar 10 segundos"><svg width="44" height="44" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12a7 7 0 1 0 2-5M5 4v4h4"/></svg></button>
      <button class="g" id="pp" aria-label="Reproduzir ou pausar"><svg class="pl" width="34" height="34" viewBox="0 0 24 24" fill="currentColor" stroke="none" aria-hidden="true"><path d="M7 4.500v15l13-7.500z"/></svg><svg class="pa" width="34" height="34" viewBox="0 0 24 24" fill="currentColor" stroke="none" aria-hidden="true"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg></button>
      <button class="sk" id="fw" aria-label="Avançar 10 segundos"><svg width="44" height="44" viewBox="0 0 24 24" aria-hidden="true"><path d="M19 12a7 7 0 1 1-2-5M19 4v4h-4"/></svg></button></div>
    <div class="bot"><span class="sb" id="t1">0:00</span><input class="sb" id="sk" type="range" min="0" max="1000" value="0" aria-label="Posição"><span class="sb" id="t2">0:00</span><span style="flex:1" class="lvs"></span><button class="rd g" id="ar" aria-label="Proporção da tela"><svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="6" width="17" height="12" rx="2"/><path d="M7 10V9.500h.5M17 14v.5h-.5"/></svg></button><button class="rd g" id="fs" aria-label="Tela cheia"><svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button></div>
  </div>
  <div id="er"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.13/dist/hls.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mpegts.js@1.7.3/dist/mpegts.js"></script>
<script>
(function(){'use strict';
const $=s=>document.querySelector(s);
const LS={get(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
let items=[],view=[],shown=0,tab='home',XC=null,hi=0,hl=[],htm=null,cur=null,hls=null,mp=null,rec=LS.get('rec')||[];

async function detect(){

  const own=/^https?:/.test(location.protocol)?location.origin:'';
  const ext=$('#srv').value.trim().replace(/\/+$/,'');
  for(const b of [own,ext].filter(Boolean)){
    try{
      const r=await fetch(b+'/health');const j=await r.json();
      if(j&&j.ok){SRV=true;BASE=b===own?'':b;
        if(j.auth&&!KEY){KEY=prompt('Senha do servidor:')||'';LS.set('key',KEY)}
        $('#pxs').textContent='proxy ativo';$('#pxs').className='ok';$('#srv').hidden=b===own;return}

}
async function getText(u){

/* ---------- M3U ---------- */
function parseM3U(t){
  const out=[];let m=null;
  for(const raw of t.split(/\r?\n/)){
    const l=raw.trim();if(!l)continue;
    if(l.startsWith('#EXTINF')){
      const a=k=>(l.match(new RegExp(k+'="([^"]*)"','i'))||[])[1]||'';
      m={name:l.slice(l.lastIndexOf(',')+1).trim()||a('tvg-name')||'Sem nome',logo:a('tvg-logo'),group:a('group-title')||'Sem grupo'};
    }else if(l[0]!=='#'){
      if(!m)m={name:decodeURIComponent(l.split('?')[0].split('/').pop()||l),logo:'',group:'Sem grupo'};
      m.url=l;m.type=/\.(mp4|mkv|avi|mov)(\?|$)|\/movie\//i.test(l)?'vod':'live';
      out.push(m);m=null;
    }
  }
  return out;
}

}

/* ---------- Séries (M3U) ---------- */
function groupSeries(arr){
  const out=[],map=new Map();
  for(const i of arr){
    const isS=/\/series\//i.test(i.url),m=(i.type==='vod'||isS)&&i.name.match(/^(.*?)[\s._-]*S(\d{1,2})\s*[._-]?\s*E(\d{1,3})/i);
    if(!m){if(isS&&i.type==='live')i.type='vod';out.push(i);continue}
    const base=(m[1]||i.name).trim()||i.name,key=base.toLowerCase()+'|'+i.group;
    let s=map.get(key);
    if(!s){s={type:'series',name:base,logo:i.logo,group:i.group,url:'series:'+key,eps:[]};map.set(key,s);out.push(s)}
    if(!s.logo&&i.logo)s.logo=i.logo;
    s.eps.push({name:i.name,url:i.url,s:+m[2],e:+m[3]});
  }
  map.forEach(s=>s.eps.sort((a,b)=>a.s-b.s||a.e-b.e));
  return out;
}

function rng(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}

/* ---------- Reprodução ---------- */
function kill(){
  if(hls){hls.destroy();hls=null}
  if(mp){try{mp.destroy()}catch(e){}mp=null}
  v.removeAttribute('src');v.load();
}
const fail=t=>{$('#er').textContent=t};
function start(u,fb){
  kill();
  const src=px(u);
  const isHls=/\.m3u8(\?|$)/i.test(u)||/output=m3u8/i.test(u);
  const next=(why)=>{if(fb){const f=fb;fb=null;f()}else fail(why)};
  const why=NATIVE?'Não foi possível abrir este canal (fora do ar, conta sem acesso ou formato não suportado).':SRV?'O servidor não conseguiu abrir este canal (fora do ar, conta sem acesso ou IP do servidor bloqueado pelo provedor).':'Sem servidor proxy, o navegador pode bloquear este canal (CORS ou http em página https).';
  if(isHls&&window.Hls&&Hls.isSupported()){
    hls=new Hls();hls.loadSource(abs(src));hls.attachMedia(v);
    hls.on(Hls.Events.ERROR,(e,d)=>{if(d.fatal)next(why+' ('+d.details+')')});
  }else if(!isHls&&!/\.(mp4|webm|mkv|mov|mp3|aac)(\?|$)/i.test(u)&&window.mpegts&&mpegts.isSupported()){
    mp=mpegts.createPlayer({type:'mpegts',isLive:true,url:abs(src)});
    mp.attachMediaElement(v);mp.load();
    mp.on(mpegts.Events.ERROR,()=>next(why));
  }else v.src=abs(src);
  v.play().catch(()=>{});
}

function play(it){
  cur=it;fail('');
  rec=[it,...rec.filter(x=>x.url!==it.url)].slice(0,12);LS.set('rec',rec);
  $('#np').textContent=it.name;
  pl.hidden=false;document.body.classList.add('lock');
  pl.classList.toggle('live',it.type==='live');$('#lvb').hidden=it.type!=='live';
  $('#sk').value=0;$('#t1').textContent='0:00';$('#t2').textContent='0:00';peek();applyAR();$('#pd').hidden=it.type==='live'||!!it.local;
  const u=it.url,xt=/\/\d+(\.ts)?(\?.*)?$/i;
  if(it.alt)start(u,()=>start(it.alt));
  else if(it.type==='live'&&xt.test(u))start(u.replace(/(\/\d+)(\.ts)?(\?.*)?$/i,'$1.m3u8$3'),()=>start(u));
  else if(it.local){kill();v.src=u;v.play().catch(()=>{})}
  else start(u);
}
function closeP(){
  kill();pl.hidden=true;document.body.classList.remove('lock');renderRec();
  if(document.fullscreenElement)document.exitFullscreen().catch(()=>{});
  try{screen.orientation.unlock()}catch(e){}
}
v.addEventListener('error',()=>{if(cur&&!hls&&!mp&&v.getAttribute('src'))fail(SRV||NATIVE?'Não foi possível abrir este arquivo (formato não suportado pelo navegador ou arquivo indisponível).':'Sem servidor proxy, o navegador pode bloquear este endereço.')});
/* controles do player */
const fmt=s=>{if(!isFinite(s))return '0:00';s=Math.floor(s);const h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;return (h?h+':'+String(m).padStart(2,'0'):m)+':'+String(x).padStart(2,'0')};
let ht=null;
function peek(){pl.classList.remove('hide');clearTimeout(ht);if(!v.paused)ht=setTimeout(()=>pl.classList.add('hide'),3200)}
function upd(){
  const live=!isFinite(v.duration);pl.classList.toggle('live',live||cur&&cur.type==='live'&&!isFinite(v.duration));
  if(!live){$('#sk').value=v.currentTime/v.duration*1000||0;$('#t1').textContent=fmt(v.currentTime);$('#t2').textContent='-'+fmt(v.duration-v.currentTime)}
}
['timeupdate','durationchange','loadedmetadata'].forEach(e=>v.addEventListener(e,upd));
['play','pause'].forEach(e=>v.addEventListener(e,()=>{pl.classList.toggle('paused',v.paused);peek()}));
$('#pp').onclick=e=>{e.stopPropagation();v.paused?v.play():v.pause();peek()};
$('#rw').onclick=e=>{e.stopPropagation();v.currentTime=Math.max(0,v.currentTime-10);peek()};
$('#fw').onclick=e=>{e.stopPropagation();v.currentTime=Math.min(v.duration||1e9,v.currentTime+10);peek()};
$('#sk').oninput=e=>{if(isFinite(v.duration))v.currentTime=e.target.value/1000*v.duration;peek()};
$('#cl').onclick=e=>{e.stopPropagation();closeP()};
$('#fs').onclick=e=>{e.stopPropagation();
  if(document.fullscreenElement){document.exitFullscreen().catch(()=>{});try{screen.orientation.unlock()}catch(x){}return}
  if(pl.requestFullscreen)pl.requestFullscreen().then(()=>{try{screen.orientation.lock('landscape').catch(()=>{})}catch(x){}}).catch(()=>{});
  else if(v.webkitEnterFullscreen)v.webkitEnterFullscreen();
};
pl.addEventListener('click',e=>{if(e.target.closest('button,input'))return;pl.classList.contains('hide')?peek():pl.classList.add('hide')});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){if(!pl.hidden)closeP();else if(!$('#sr').hidden)$('#sr').hidden=true;else $('#setup').hidden=true}
  if(pl.hidden||/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName))return;
  if(e.key===' '){e.preventDefault();v.paused?v.play():v.pause()}
  if(e.key==='ArrowLeft')v.currentTime-=10;if(e.key==='ArrowRight')v.currentTime+=10;
});
/* ---------- Downloads ---------- */
const FS=()=>window.Capacitor&&Capacitor.Plugins&&Capacitor.Plugins.Filesystem;
const DLI='<svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v11M7.5 11l4.5 4.5 4.5-4.5M5 19.5h14"/></svg>';
let dls=LS.get('dls')||[],tt=null;dls.forEach(d=>{if(d.st==='run')d.st='err'});
const saveD=()=>LS.set('dls',dls);
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>e.classList.remove('on'),2200)}
const extOf=u=>{const m=u.split('?')[0].match(/\.(mp4|mkv|avi|mov|webm|ts|m4v)$/i);return m?m[1].toLowerCase():'mp4'};
const fm=b=>b>=1e9?(b/1e9).toFixed(2)+' GB':Math.round(b/1e6)+' MB';
async function download(it){
  if(it.type==='series')return toast('Abra a série e baixe um episódio.');
  if(it.type==='live'||/\.m3u8(\?|$)/i.test(it.url))return toast('Transmissões ao vivo não podem ser baixadas.');
  if(!NATIVE||!FS()){window.open(px(abs(it.url)),'_blank');return toast('Download aberto pelo navegador.')}
  if(dls.some(d=>d.url===it.url&&d.st!=='err'))return toast('Esse item já está nos downloads.');
  dls=dls.filter(d=>d.url!==it.url);
  const d={id:'d'+Date.now(),name:it.name,logo:it.logo,group:it.group,url:it.url,st:'run',b:0,t:0};
  d.path='downloads/'+d.id+'.'+extOf(it.url);dls.unshift(d);saveD();toast('Download iniciado');if(tab==='dl')renderDL();
  try{await FS().downloadFile({url:it.url,path:d.path,directory:'DATA',recursive:true,progress:true,headers:{'User-Agent':'VLC/3.0.20 LibVLC/3.0.20'}});d.st='done';d.size=d.t||d.b}
  catch(e){d.st='err';d.msg=String(e&&e.message||e)}
  saveD();if(tab==='dl')renderDL();
}
function upBar(d){
  if(tab!=='dl')return;const r=document.querySelector('[data-d="'+d.id+'"]');if(!r)return;
  const p=d.t?Math.min(100,d.b/d.t*100):0;
  r.querySelector('.st').textContent=fm(d.b)+(d.t?' de '+fm(d.t)+' · '+Math.round(p)+'%':'');
  r.querySelector('.pr b').style.width=p+'%';
}
if(FS()&&FS().addListener)FS().addListener('progress',ev=>{const d=dls.find(x=>x.url===ev.url&&x.st==='run');if(!d)return;d.b=ev.bytes;d.t=ev.contentLength;upBar(d)});
async function playLocal(d){
  try{const r=await FS().getUri({path:d.path,directory:'DATA'});
    play({name:d.name,logo:d.logo,group:d.group,type:'vod',url:Capacitor.convertFileSrc(r.uri),local:true})}
  catch(e){toast('Arquivo não encontrado. Baixe de novo.')}
}
function renderDL(){
  const L=$('#dll');L.innerHTML='';
  $('#dlh').textContent=NATIVE&&FS()?'Os arquivos ficam guardados dentro do app.':'Os downloads salvos no aparelho só funcionam no app. No navegador, o arquivo baixa pelo próprio navegador.';
  if(!dls.length){L.innerHTML='<p class="s2">Nenhum download ainda. Toque no ícone de download em um filme, em um episódio ou no player.</p>';return}
  dls.forEach(d=>{
    const r=document.createElement('div');r.className='dr';r.dataset.d=d.id;
    const i=document.createElement('i');i.style.background=grad(d.name);i.append(logo(d));
    const t=document.createElement('div');t.className='dt';
    t.innerHTML='<span class="n"></span><span class="st"></span><div class="pr"><b></b></div>';
    t.querySelector('.n').textContent=d.name;
    const st=t.querySelector('.st'),pr=t.querySelector('.pr');
    if(d.st==='done'){st.textContent=fm(d.size||0)+' · toque para assistir';pr.hidden=true}
    else if(d.st==='err'){st.textContent='Falhou · toque para tentar de novo';st.classList.add('bad');pr.hidden=true}
    else{const p=d.t?Math.min(100,d.b/d.t*100):0;st.textContent=fm(d.b)+(d.t?' de '+fm(d.t)+' · '+Math.round(p)+'%':'');pr.firstChild.style.width=p+'%'}
    r.append(i,t);
    if(d.st!=='run'){
      const x=document.createElement('button');x.className='dx';x.setAttribute('aria-label','Remover');
      x.innerHTML='<svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 7h14M10 7V4.5h4V7M7 7l1 12h8l1-12"/></svg>';
      x.onclick=e=>{e.stopPropagation();if(FS())FS().deleteFile({path:d.path,directory:'DATA'}).catch(()=>{});dls=dls.filter(y=>y!==d);saveD();renderDL()};
      r.append(x);
    }
    r.onclick=()=>{if(d.st==='done')playLocal(d);else if(d.st==='err')download({name:d.name,logo:d.logo,group:d.group,url:d.url,type:'vod'})};
    L.append(r);
  });
}
$('#pd').onclick=e=>{e.stopPropagation();if(cur)download(cur)};
/* ---------- Atualização do app ---------- */
const REPO='edson684/lumenapp';let UPD=null;
async function checkUpd(manual){
  const A=window.Capacitor&&Capacitor.Plugins&&Capacitor.Plugins.App;
  if(!NATIVE||!A||!A.getInfo){if(manual)toast('A verificação só funciona no app.');return}
  $('#bup').hidden=false;
  try{
    const inf=await A.getInfo(),cur=+inf.build||0;
    $('#ver').textContent='Versão instalada: '+inf.version+' (compilação '+inf.build+')';
    const r=await fetch('https://api.github.com/repos/'+REPO+'/releases/latest');
    if(!r.ok)throw Error(r.status===404?'repositório privado ou sem versões':'HTTP '+r.status);
    const j=await r.json(),n=+((String(j.tag_name).match(/(\d+)$/)||[])[1])||0;
    const a=(j.assets||[]).find(x=>/\.apk$/i.test(x.name));
    if(n>cur&&a){UPD={url:a.browser_download_url};$('#upt').textContent='Nova versão disponível: '+String(j.tag_name).replace(/^v/,'');$('#upd').hidden=false;if(manual)$('#setup').hidden=true}
    else if(manual)toast('Você já está na versão mais recente.');
  }catch(e){if(manual)toast('Não foi possível verificar: '+e.message)}
}
function getUpd(){
  if(!UPD)return;const B=window.Capacitor&&Capacitor.Plugins&&Capacitor.Plugins.Browser;
  if(B&&B.open)B.open({url:UPD.url});else window.open(UPD.url,'_blank');
  toast('Baixando. Ao terminar, toque na notificação para instalar.');
}
/* ---------- Eventos ---------- */
const openS=()=>{$('#setup').hidden=false};
$('#oe').onclick=openS;$('#bs').onclick=openS;
$('#bf').onclick=()=>{const t=tab==='fav'?'home':'fav';setTab(t);fillG();filter();scrollTo(0,0)};
['setup','sr','gs'].forEach(id=>$('#'+id).addEventListener('click',e=>{if(e.target.id===id)$('#'+id).hidden=true}));
$('#st').onclick=e=>{const p=e.target.dataset.p;if(!p)return;
  document.querySelectorAll('#st button').forEach(b=>b.classList.toggle('on',b===e.target));
  $('#p-m').hidden=p!=='m';$('#p-x').hidden=p!=='x';};
$('#ft').onclick=e=>{const b=e.target.closest('button');if(!b)return;
  setTab(b.dataset.t);fillG();filter();scrollTo(0,0);};
$('#bm').onclick=loadM3U;$('#bx').onclick=loadX;
$('#gb').onclick=()=>{$('#gq').value='';drawG();$('#gs').hidden=false};$('#gq').oninput=drawG;
$('#upb').onclick=getUpd;$('#upx').onclick=()=>{$('#upd').hidden=true};$('#bup').onclick=()=>checkUpd(true);
$('#bdel').onclick=()=>{items=[];XC=null;DB.del('lib');$('#bdel').hidden=true;msg('Lista salva removida.');fillG();filter()};
$('#q').oninput=filter;$('#g').onchange=filter;
const openIt=i=>i.type==='series'?openSeries(i):play(i);
function toggleFav(i,fb){
  favs.has(i.url)?favs.delete(i.url):favs.add(i.url);LS.set('favs',[...favs]);
  if(fb)fb.classList.toggle('on');if(tab==='fav')filter();
}
$('main').addEventListener('click',e=>{
  if(e.target.closest('#hw')&&hl[hi])return openIt(hl[hi]);
  if(e.target.closest('#hl')&&hl[hi]){toggleFav(hl[hi]);$('#hl').textContent=favs.has(hl[hi].url)?'Na minha lista':'+ Minha lista';return}
  const d=e.target.closest('.tl,.rc');if(!d||!d.it)return;
  if(e.target.closest('[data-dl]'))return download(d.it);
  const fb=e.target.closest('[data-fav]');
  if(fb)return toggleFav(d.it,fb);
  openIt(d.it);
});
$('main').addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.classList.contains('tl'))openIt(e.target.it)});
let tx=0;
$('#homec').addEventListener('touchstart',e=>{tx=e.touches[0].clientX},{passive:true});
$('#homec').addEventListener('touchend',e=>{if(!e.target.closest('#hero')||hl.length<2)return;const dx=e.changedTouches[0].clientX-tx;if(Math.abs(dx)>50)setHero((hi+(dx<0?1:hl.length-1))%hl.length)},{passive:true});
addEventListener('scroll',()=>{if(!$('#list').hidden&&shown<view.length&&innerHeight+scrollY>document.body.scrollHeight-600)more()},{passive:true});

const AP=window.Capacitor&&Capacitor.Plugins&&Capacitor.Plugins.App;
if(AP&&AP.addListener)AP.addListener('backButton',()=>{
  if(!pl.hidden)closeP();
  else if(!$('#sr').hidden)$('#sr').hidden=true;
  else if(!$('#setup').hidden)$('#setup').hidden=true;
  else if(tab!=='home'||$('#q').value){$('#q').value='';setTab('home');fillG();filter();scrollTo(0,0)}
  else if(AP.exitApp)AP.exitApp();
});
const c=LS.get('cfg');
if(c){['mu','xs','xu','xp','srv','fmt'].forEach(k=>{if(c[k]!==undefined&&$('#'+k))$('#'+k).value=c[k]})}
$('#empty').hidden=false;
detect();
setTimeout(()=>checkUpd(false),2000);
DB.get('lib').then(d=>{
  if(!d||!d.items||!d.items.length)return;
  items=d.items;XC=d.XC||null;fillG();filter();$('#bdel').hidden=false;
  msg('Lista salva: '+items.length+' itens.');
});

})();
</script>
